<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Artwork - Free Design</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/artworks.css?v=1.0" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🎨 Free Design</a>
        <div class="navbar-nav ms-auto">
            <span class="navbar-text me-3">
                Welcome, <span sec:authentication="name" class="fw-bold"></span>
            </span>
            <a class="btn btn-outline-light btn-sm" href="/artworks">Back to Artworks</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="form-container">
        <div class="card shadow">
            <div class="card-header bg-white py-3">
                <h2 class="h4 mb-0 text-center">
                    <i class="bi bi-pencil-square me-2"></i>
                    Edit Artwork
                </h2>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data" th:object="${artWorkUploadDTO}">

                    <!-- ID Field -->
                    <div class="row mb-4">
                        <label class="col-sm-3 col-form-label fw-semibold">Artwork ID</label>
                        <div class="col-sm-9">
                            <input readonly class="form-control-plaintext text-muted" th:value="${artWorkUploadDTO.id}">
                        </div>
                    </div>

                    <!-- Name Field -->
                    <div class="row mb-4">
                        <label class="col-sm-3 col-form-label fw-semibold">Artwork Name</label>
                        <div class="col-sm-9">
                            <input class="form-control" th:field="*{name}" placeholder="Enter artwork name">
                            <div th:if="${#fields.hasErrors('name')}" class="text-danger small mt-1">
                                <i class="bi bi-exclamation-circle"></i>
                                <span th:errors="*{name}"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Price Field -->
                    <div class="row mb-4">
                        <label class="col-sm-3 col-form-label fw-semibold">Price ($)</label>
                        <div class="col-sm-9">
                            <div class="input-group">
                                <span class="input-group-text bg-light">$</span>
                                <input type="number" class="form-control" th:field="*{price}" min="0" step="0.01" placeholder="0.00">
                            </div>
                            <div th:if="${#fields.hasErrors('price')}" class="text-danger small mt-1">
                                <i class="bi bi-exclamation-circle"></i>
                                <span th:errors="*{price}"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Notes Field -->
                    <div class="row mb-4">
                        <label class="col-sm-3 col-form-label fw-semibold">Description</label>
                        <div class="col-sm-9">
                            <textarea class="form-control" th:field="*{notes}" rows="4"
                                      placeholder="Describe your artwork..."></textarea>
                            <div class="form-text">Maximum 1000 characters</div>
                            <div th:if="${#fields.hasErrors('notes')}" class="text-danger small mt-1">
                                <i class="bi bi-exclamation-circle"></i>
                                <span th:errors="*{notes}"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Current Image -->
                    <div class="row mb-4">
                        <label class="col-sm-3 col-form-label fw-semibold">Current Image</label>
                        <div class="col-sm-9">
                            <div class="image-preview">
                                <img th:src="@{'/images/' + ${artwork.imageFileName}}"
                                     class="img-fluid rounded" style="max-height: 200px;"
                                     th:alt="${artWorkUploadDTO.name}">
                                <div class="mt-2 text-muted small">
                                    Current artwork image
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- New Image Upload -->
                    <div class="row mb-4">
                        <label class="col-sm-3 col-form-label fw-semibold">Update Image</label>
                        <div class="col-sm-9">
                            <div class="input-group">
                                <input type="file" class="form-control" th:field="*{imageFile}"
                                       accept="image/*">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-image text-muted"></i>
                                </span>
                            </div>
                            <div class="form-text">Leave empty to keep current image</div>
                            <div th:if="${#fields.hasErrors('imageFile')}" class="text-danger small mt-1">
                                <i class="bi bi-exclamation-circle"></i>
                                <span th:errors="*{imageFile}"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="row mt-5">
                        <div class="col-sm-9 offset-sm-3">
                            <div class="d-flex gap-3">
                                <button type="submit" class="btn btn-submit text-white flex-fill">
                                    <i class="bi bi-check-lg me-2"></i>
                                    Update Artwork
                                </button>
                                <a class="btn btn-outline-secondary" href="/artworks">
                                    <i class="bi bi-x-lg me-2"></i>
                                    Cancel
                                </a>
                            </div>
                        </div>
                    </div>

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
